<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview</title>
    <style>
        :root {
            --primary-color: #64B5F6;
            --secondary-color: #90CAF9;
            --background-color: #121212;
            --card-color: rgba(30, 30, 30, 0.95);
            --text-color: #E0E0E0;
            --border-color: rgba(100, 181, 246, 0.2);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--background-color);
            min-height: 100vh;
            position: relative;
            overflow: hidden;
        }

        .preview-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .preview-content {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }

        .gradient-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 20%, rgba(39, 140, 191, 0.823) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(144, 202, 249, 0.1) 0%, transparent 50%);
            animation: gradientMove 15s ease infinite;
        }

        .gradient-background::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                linear-gradient(45deg, rgba(100, 181, 246, 0.05) 0%, transparent 50%),
                linear-gradient(-45deg, rgba(144, 202, 249, 0.05) 0%, transparent 50%);
            animation: gradientMove2 20s ease infinite;
        }

        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: var(--primary-color);
            border-radius: 50%;
            opacity: 0.3;
            animation: particleMove 10s linear infinite;
        }

        @keyframes gradientMove {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        @keyframes gradientMove2 {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes particleMove {
            0% { transform: translateY(0) translateX(0); opacity: 0; }
            50% { transform: translateY(-100px) translateX(100px); opacity: 0.5; }
            100% { transform: translateY(-200px) translateX(200px); opacity: 0; }
        }
    </style>
</head>
<body>
    <div class="preview-container">
        <div class="preview-content">
            <div class="gradient-background"></div>
            <div class="particles" id="particles"></div>
        </div>
    </div>

    <script>
        // Создаем частицы
        const particlesContainer = document.getElementById('particles');
        const particleCount = 50;

        for (let i = 0; i < particleCount; i++) {
            const particle = document.createElement('div');
            particle.className = 'particle';
            particle.style.left = `${Math.random() * 100}%`;
            particle.style.top = `${Math.random() * 100}%`;
            particle.style.animationDelay = `${Math.random() * 10}s`;
            particlesContainer.appendChild(particle);
        }
    </script>
</body>
</html>
